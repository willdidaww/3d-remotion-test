    function restart() { setPlaying(false); applyStage(0); }

    // -----------------------------------------------------------------------
    // Transport.
    // -----------------------------------------------------------------------
    function setPlaying(on) {
      playing = !!on;
      btnPlay.innerHTML = playing ? '<span class="ctl-icon">&#10073;&#10073;</span> Pause'
                                  : '<span class="ctl-icon">&#9654;</span> Play';
      btnPlay.classList.toggle('active', playing);
    }
    function togglePlay() { setPlaying(!playing); }

    function setSlowMotion(on) {
      slowMotion = !!on;
      API.setPlaybackSpeed(slowMotion ? SLOW_SPEED : NORMAL_SPEED);
      btnSpeed.textContent = slowMotion ? 'Normal Speed' : 'Slow Motion';
      btnSpeed.classList.toggle('active', slowMotion);
    }

    // -----------------------------------------------------------------------
    // RPM slider — discrete stops 0/2000/4000/6000/8000/11000.
    // The slider index (0..5) maps to API.RPM_STEPS.
    // -----------------------------------------------------------------------
    const RPM_STEPS = API.RPM_STEPS; // [0,2000,4000,6000,8000,11000]
    function rpmStepLabel(rpm) {
      return rpm === 0 ? '0 RPM' : rpm.toLocaleString('id-ID') + ' RPM';
    }
    function syncRpmUiFromScene() {
      const rpm = API.getRPM();
      let idx = RPM_STEPS.indexOf(rpm);
      if (idx < 0) idx = 0;
      rpmSlider.value = String(idx);
      rpmValue.textContent = rpmStepLabel(rpm);
    }
    rpmSlider.addEventListener('input', () => {
      const idx = Math.max(0, Math.min(RPM_STEPS.length - 1, parseInt(rpmSlider.value, 10) || 0));
      const rpm = RPM_STEPS[idx];
      API.setRPM(rpm);
      rpmValue.textContent = rpmStepLabel(API.getRPM());
    });

    // -----------------------------------------------------------------------
    // Camera controls.
    // -----------------------------------------------------------------------
    btnResetCam.addEventListener('click', () => API.resetCamera());
    btnAutoRotate.addEventListener('click', () => {
      const on = API.toggleAutoRotate();
      btnAutoRotate.classList.toggle('on', on);
    });

    // -----------------------------------------------------------------------
    // Cutaway mode buttons (exactly four) — Full Body / Transparent Housing /
    // Section Cutaway / Exploded View.
    // -----------------------------------------------------------------------
    const cutawayGroup = document.getElementById('cutaway-group');
    const cutawayButtons = {};
    API.CUTAWAY_MODES.forEach((mode) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'mini-btn';
      b.textContent = API.CUTAWAY_LABELS[mode]; // exact labels from FEAT-002
      b.addEventListener('click', () => {
        API.setCutawayMode(mode);
        refreshCutawayButtons();
      });
      cutawayGroup.appendChild(b);
      cutawayButtons[mode] = b;
    });
    function refreshCutawayButtons() {
      const active = API.getCutawayMode();
      Object.keys(cutawayButtons).forEach((m) => {
        cutawayButtons[m].classList.toggle('active', m === active);
      });
    }

    // -----------------------------------------------------------------------
    // Component visibility toggles (nine components).
    // -----------------------------------------------------------------------
    const VIS_LABELS = {
      housing: 'Outer Housing',
      armature: 'Armature',
      commutator: 'Commutator',
      carbonBrushes: 'Carbon Brushes',
      stator: 'Stator',
      coolingFan: 'Cooling Fan',
      bevelGear: 'Bevel Gear',
      spindle: 'Spindle',
      grindingDisc: 'Grinding Disc'
    };
    const visibilityGroup = document.getElementById('visibility-group');
    const visState = {};
    Object.keys(VIS_LABELS).forEach((name) => {
      visState[name] = true;
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'mini-btn on';
      b.textContent = VIS_LABELS[name];
      b.addEventListener('click', () => {
        visState[name] = !visState[name];
        API.setComponentVisible(name, visState[name]);
        b.classList.toggle('on', visState[name]);
      });
      visibilityGroup.appendChild(b);
      visState['_btn_' + name] = b;
    });
    // Keep the visibility button states in sync when stages change internals.
    function syncVisibilityButtons() {
      Object.keys(VIS_LABELS).forEach((name) => {
        const grp = API.components.get((API.VISIBILITY_GROUPS[name] || [name])[0]);
        const on = grp ? grp.visible : true;
        visState[name] = on;
        const b = visState['_btn_' + name];
        if (b) b.classList.toggle('on', on);
      });
    }

    // -----------------------------------------------------------------------
    // Hide Overlay — hides ALL UI (header, panels, controls, labels, safe-zone)
    // via CSS classes WITHOUT pausing requestAnimationFrame or the 3D animation.
    // A small corner affordance (#restore-ui) always remains to bring it back.
    // -----------------------------------------------------------------------
    let uiHidden = false;
    function setUiHidden(hide) {
      uiHidden = !!hide;
      uiLayer.classList.toggle('ui-hidden', uiHidden);       // header/panels/controls
      overlay.classList.toggle('overlay-hidden', uiHidden);  // technical labels
      API.setOverlayVisible(!uiHidden);                      // keep API state coherent
      safeZone.classList.toggle('visible', !uiHidden && safeZoneOn); // hide guide too
      restoreUI.classList.toggle('visible', uiHidden);
    }
    btnHideOverlay.addEventListener('click', () => setUiHidden(true));
    restoreUI.addEventListener('click', () => setUiHidden(false));

    // -----------------------------------------------------------------------
    // Safe Zone guide — 100px inset boundary on all four sides.
    // -----------------------------------------------------------------------
    let safeZoneOn = false;
    function toggleSafeZone() {
      safeZoneOn = !safeZoneOn;
      safeZone.classList.toggle('visible', safeZoneOn && !uiHidden);
      btnSafeZone.classList.toggle('active', safeZoneOn);
    }
    btnSafeZone.addEventListener('click', toggleSafeZone);

    // -----------------------------------------------------------------------
    // Transport button wiring.
    // -----------------------------------------------------------------------
    btnPlay.addEventListener('click', togglePlay);
    btnPrev.addEventListener('click', () => { prevStage(); });
    btnNext.addEventListener('click', () => { nextStage(); });
    btnRestart.addEventListener('click', restart);
    btnSpeed.addEventListener('click', () => setSlowMotion(!slowMotion));

    // -----------------------------------------------------------------------
    // Auto-play driver. Uses its own rAF-independent timer fed by a lightweight
    // interval; stage advance is scaled by the playback speed multiplier so
    // Slow Motion stretches the storytelling too. This does NOT drive the 3D
    // render loop (that is the untouched FEAT-002 animate()).
    // -----------------------------------------------------------------------
    let lastTick = performance.now();
    function tick(now) {
      const dt = Math.min((now - lastTick) / 1000, 0.1);
      lastTick = now;
      if (playing) {
        stageTimer += dt * (slowMotion ? SLOW_SPEED : NORMAL_SPEED);
        if (stageTimer >= STAGE_DURATION) {
          stageTimer = 0;
          if (stageIndex >= STAGE_COUNT - 1) {
            applyStage(0); // loop the story
          } else {
            nextStage();
          }
        }
      }
      // Keep UI reflections fresh (cheap).
      refreshCutawayButtons();
      syncVisibilityButtons();
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    // -----------------------------------------------------------------------
    // Init.
    // -----------------------------------------------------------------------
    setSlowMotion(false);
    setPlaying(false);
    applyStage(0);
    refreshCutawayButtons();
    syncVisibilityButtons();
  })();
  </script>
</body>
</html>
